name: Dotfiles

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  check:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: sudo apt-get install -y shellcheck zsh

      - name: Run quality gates
        run: make check

  bootstrap-dry-run:
    name: Bootstrap Dry Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Verify scripts are executable
        run: |
          test -x bootstrap.sh
          test -x uninstall.sh

      - name: Check for required files
        run: |
          test -f home/.zshrc
          test -f home/.gitconfig
          test -f home/.vimrc
          test -f home/.tmux.conf
