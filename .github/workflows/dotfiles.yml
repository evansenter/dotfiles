name: Dotfiles

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Run shellcheck  # shellcheck is preinstalled on ubuntu-latest
        run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Run syntax checks
        run: make test

  hooks:
    name: Hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run hook tests  # jq is preinstalled on ubuntu-latest
        run: make test-hooks

  bootstrap:
    name: Bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Verify scripts are executable
        run: |
          test -x bootstrap.sh
          test -x uninstall.sh
          test -x tests/test-hooks.sh
          test -x tests/test-bootstrap.sh

      - name: Check for required files
        run: |
          test -f home/.zshrc
          test -f home/.gitconfig
          test -f home/.vimrc
          test -f home/.tmux.conf

      # The checks above only assert files exist and are executable — they pass
      # through any logic regression in bootstrap.sh. This is the step that
      # actually tests it (flag parsing, host-gating, LaunchAgent install,
      # self-update re-exec). It stubs launchctl/brew/curl, so no macOS-only
      # binaries are needed.
      - name: Run bootstrap tests
        run: make test-bootstrap
