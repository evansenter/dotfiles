#? Config file for btop

# Catppuccin Mocha theme (synced from vendor/btop-catppuccin)
color_theme = "catppuccin_mocha"

# Transparent background (use terminal background)
theme_background = False

# Enable 24-bit truecolor
truecolor = True

# Rounded corners
rounded_corners = True

# Use braille for highest resolution graphs
graph_symbol = "braille"

# Vim-style navigation (h,j,k,l)
vim_keys = True

# Refresh every 1s instead of 100ms (reduces CPU usage)
update_ms = 1000

# Sort by CPU, only re-sort when values change significantly
proc_sorting = "cpu lazy"
