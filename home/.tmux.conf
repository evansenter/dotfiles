# ==============================================================================
# General Settings
# ==============================================================================

# Enable mouse support
set -g mouse on

# Increase scrollback buffer
set -g history-limit 50000

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Auto-rename windows: dirname when idle, command when running
# Format: if pane_current_command == "zsh" then show basename of path, else show command
setw -g automatic-rename on
setw -g automatic-rename-format '#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{pane_current_command}}'

# Auto-name new sessions after the current directory
set-hook -g session-created 'run-shell "tmux rename-session \"$(basename \"$(tmux display-message -p -F \"#{pane_current_path}\")\")\" 2>/dev/null || true"'

# Additional prefix: Ctrl-Q (requires stty -ixon in shell)
set -g prefix2 C-q
bind C-q send-prefix -2

# Reduce escape time (important for vim)
set -sg escape-time 10

# Enable true color support and italics
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
# Override italics escape sequences (sitm=start, ritm=reset) for terminals that need it
set -as terminal-overrides ',*:sitm=\E[3m:ritm=\E[23m'

# ==============================================================================
# Key Bindings
# ==============================================================================

# Split panes with | and - (more intuitive than % and ")
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded"

# Navigate windows (repeatable)
bind -r p previous-window
bind -r n next-window

# Move window left/right (repeatable)
bind -r < swap-window -t -1\; select-window -t -1
bind -r > swap-window -t +1\; select-window -t +1

# Equal-width columns layout
bind \\ select-layout even-horizontal
# Equal-height rows layout
bind = select-layout even-vertical

# Tiled layout (2x2 grid)
bind + select-layout tiled

# ==============================================================================
# Plugins
# ==============================================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'catppuccin/tmux#v2.1.3'

# Catppuccin theme
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

# Plugin configuration
set -g @resurrect-save 'S'
set -g @resurrect-restore 'Y'
# Manual restore only (prefix + Y)
set -g @continuum-save-interval '15'


# Status bar widths
set -g status-left-length 30
set -g status-right-length 60
set -g status-right "\"#{=40:pane_title}\" %H:%M %d-%b-%y"

# Initialize TPM (keep this at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
